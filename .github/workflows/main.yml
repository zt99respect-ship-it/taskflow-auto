name: Respect 24-7

on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: 'Run ID to kill (previous run)'
        required: false
        type: string
  schedule:
    - cron: '0 */6 * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: respect-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg + streamlink + fonts
        run: |
          set -e
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig libraqm0 libfribidi0
          pip3 install --user --break-system-packages --quiet streamlink Pillow
          mkdir -p ~/.fonts
          curl -sL --max-time 30 "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o ~/.fonts/Cairo-var.ttf || true
          curl -sL --max-time 30 "https://raw.githubusercontent.com/google/fonts/main/ofl/orbitron/Orbitron%5Bwght%5D.ttf" -o ~/.fonts/Orbitron-var.ttf || true
          fc-cache -f >/dev/null 2>&1 || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pre-build standby (while old run is still broadcasting)
        env:
          STREAMERS_LIST: 'S5B,iMonkey_D,drb7h,ABO8ALYY,ID7O,F1AISAL,xmusabrt,TAF86,abo_khrbaa,Peerless,Seagull,FHLWY,Hook,okb8,wolf,NASSER,Aymnalsatam,BoQamar,NEFOXD,RAYN,xya7ya,W1pey,ALRND,klash,Sayko_911,ZAiKRx'
        run: |
          chmod +x stream.sh
          PREPARE_ONLY=1 ./stream.sh

      - name: Takeover & broadcast
        env:
          RESTREAM_KEY: 're_12394050_event67e185b829014094a368d4e64b5c4241'
          STREAMERS_LIST: 'drb7h,S5B,ABO8ALYY,ID7O,F1AISAL,xmusabrt,TAF86,abo_khrbaa,Peerless,Seagull,iMonkey_D,FHLWY,Hook,okb8,wolf,SODRY,NASSER,Aymnalsatam,BoQamar,NEFOXD,RAYN,xya7ya,W1pey,ALRND,klash,Sayko_911,ZAiKRx'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          MY_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${PARENT_RUN_ID:-}" ]; then
            echo "🔪 Killing parent run: $PARENT_RUN_ID"
            gh run cancel "$PARENT_RUN_ID" 2>/dev/null || true
            for i in $(seq 1 25); do
              sleep 1
              STATUS=$(gh run view "$PARENT_RUN_ID" --json status -q '.status' 2>/dev/null || echo "completed")
              [ "$STATUS" = "completed" ] && { echo "✅ Parent dead"; break; }
            done
          else
            echo "🔪 Cron/Manual mode: killing stale in_progress runs"
            for ID in $(gh run list --workflow=main.yml --status=in_progress --json databaseId -q '.[].databaseId' 2>/dev/null | grep -v "^${MY_RUN_ID}$"); do
              gh run cancel "$ID" 2>/dev/null || true
            done
            sleep 3
          fi

          exec ./stream.sh
